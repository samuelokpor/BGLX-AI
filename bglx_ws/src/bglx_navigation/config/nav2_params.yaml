# Nav2 params for the BGLX e-trike (ROS 2 Humble).
# DEST: bglx_ws/src/bglx_navigation/config/nav2_params.yaml
#
# Track A migration: STEERED TRICYCLE (cannot rotate in place).
#   - global planner : Smac Hybrid-A* (respects a minimum turning radius)
#   - local controller: Regulated Pure Pursuit (use_rotate_to_heading=false)
#   - odometry comes from the ros2_control tricycle_steering_controller.
# Localization/map from slam_toolbox (map -> odom). No AMCL.

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /tricycle_steering_controller/odometry
    bt_loop_duration: 10
    default_server_timeout: 20
    # NOTE (real vehicle): the default BT includes a Spin recovery. A steered
    # trike can't spin in place, so for hardware swap in a no-spin BT via
    # default_nav_to_pose_bt_xml. In sim it's harmless (spin just times out).

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    odom_topic: /tricycle_steering_controller/odometry
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0
    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.30
      # Car-like: cannot spin to an exact final heading, so relax yaw.
      yaw_goal_tolerance: 0.60

    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      # Start conservative; raise desired_linear_vel toward 2.78 (10 km/h)
      # once tracking looks good.
      desired_linear_vel: 1.0
      lookahead_dist: 0.6
      min_lookahead_dist: 0.4
      max_lookahead_dist: 1.5
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      # NON-HOLONOMIC: never rotate in place, never reverse (Dubins forward).
      use_rotate_to_heading: false
      allow_reversing: true
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 1.0
      # Slow down through tight curvature; min radius ties to the trike.
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.25
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[-0.30,-0.40],[1.25,-0.40],[1.25,0.40],[-0.30,0.40]]"
      plugins: ["obstacle_layer", "voxel_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /etrike/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: /etrike/front_depth/points
          min_obstacle_height: 0.12
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.05
      track_unknown_space: false
      rolling_window: false
      footprint: "[[-0.30,-0.40],[1.25,-0.40],[1.25,0.40],[-0.30,0.40]]"
      plugins: ["static_layer", "obstacle_layer", "voxel_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /etrike/scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: true
        publish_voxel_map: true
        origin_z: 0.0
        z_resolution: 0.1
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: pointcloud
        pointcloud:
          topic: /etrike/front_depth/points
          min_obstacle_height: 0.12
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "PointCloud2"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins: ["GridBased"]
    GridBased:
      # Smac Hybrid-A*: kinematically feasible paths for a car-like body.
      plugin: "nav2_smac_planner/SmacPlannerHybrid"
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 5.0
      motion_model_for_search: "REEDS_SHEPP"     # allows reverse; DUBIN for forward-only. Reverse is UNSAFE on hardware: no rear sensing in the costmap.
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 3.0
      minimum_turning_radius: 0.9          # >= URDF R (0.77 m at 1.047 rad steer), plus margin
      reverse_penalty: 2.0
      change_penalty: 0.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10

behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    # 'spin' kept so the stock BT loads; a steered trike won't actually
    # pivot (see bt_navigator note). backup/drive_on_heading are feasible.
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200
# ---------------------------------------------------------------------------
# AMCL: localise against a saved map instead of mapping continuously.
#
# Tuned for a steered tricycle, which matters in two places:
#   - the motion model is 'omnidirectional' NOT 'differential'. Nav2's
#     differential model assumes rotation can happen without translation; on
#     this platform it cannot, so the differential model mis-predicts particle
#     spread on every turn.
#   - alpha1 (rotation noise from rotation) is kept low because the EKF now
#     fuses a gyro, so heading is far more trustworthy than wheel odometry
#     alone would justify.
#
# The particle spread published in /amcl_pose covariance is the confidence
# signal the stack has been missing: a spreading cloud means the robot is
# losing track, which nothing else can currently detect.
# ---------------------------------------------------------------------------
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /etrike/scan
    robot_model_type: "nav2_amcl::OmniMotionModel"

    min_particles: 500
    max_particles: 3000
    update_min_d: 0.20              # metres of travel before an update
    update_min_a: 0.15              # radians of rotation before an update
    resample_interval: 1
    transform_tolerance: 1.0

    # motion noise: how much odometry is distrusted
    alpha1: 0.10                    # rotation noise from rotation (low: gyro)
    alpha2: 0.20                    # rotation noise from translation
    alpha3: 0.20                    # translation noise from translation
    alpha4: 0.10                    # translation noise from rotation
    alpha5: 0.10                    # strafe noise (omni model)

    laser_model_type: "likelihood_field"
    laser_likelihood_max_dist: 2.0
    laser_max_range: 25.0
    laser_min_range: 0.45
    max_beams: 120
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1

    # Kidnapped-robot recovery. A converged filter has no particles near the
    # truth after a teleport, so it cannot recover by resampling alone. These
    # inject random particles when the short-term likelihood average falls
    # below the long-term one, i.e. when observations stop fitting.
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    pf_err: 0.05
    pf_z: 0.99
    do_beamskip: false
    tf_broadcast: true
    save_pose_rate: 0.5
    set_initial_pose: false
