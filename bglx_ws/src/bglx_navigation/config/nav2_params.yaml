bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: /tricycle_steering_controller/odometry
    bt_loop_duration: 10
    default_server_timeout: 20
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    odom_topic: /tricycle_steering_controller/odometry
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins:
    - general_goal_checker
    controller_plugins:
    - FollowPath
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.5
      movement_time_allowance: 5.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 3.15    # effectively unconstrained. A tricycle cannot correct heading in place, and use_rotate_to_heading is false, so any heading constraint the vehicle does not naturally satisfy on arrival can only be met by driving loops. Observed 81m of travel for a 5m goal. Heading at a destination is what turn_by is for.
    FollowPath:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 1.2
      lookahead_dist: 1.2
      min_lookahead_dist: 0.9    # must exceed the 0.77m turning radius: pure pursuit demands curvature 2sin(a)/L, so a short lookahead asks for turns the steering cannot deliver, the limiter clamps, and the controller saturates
      max_lookahead_dist: 2.5
      lookahead_time: 1.5
      use_velocity_scaled_lookahead_dist: true
      transform_tolerance: 0.2
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.5
      use_rotate_to_heading: false
      allow_reversing: true
      min_approach_linear_velocity: 0.1
      approach_velocity_scaling_dist: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 1.0
      regulated_linear_scaling_min_speed: 0.25
      max_angular_accel: 2.0
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_footprint
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.05
      footprint: '[[-0.30,-0.40],[1.25,-0.40],[1.25,0.40],[-0.30,0.40]]'
      plugins:
      - obstacle_layer
      - inflation_layer
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan front_scan front_prox left_prox right_prox rear_prox terrain_scan
        front_scan:
          topic: /etrike/front_scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
        scan:
          topic: /etrike/scan
          max_obstacle_height: 2.0
          clearing: true
          # The 0.92m scan plane passes OVER low obstacles - a 0.6m bench,
          # a 0.9m urn - and then raytraces those cells as free, erasing
          # what the 0.30m front_lidar marked a moment earlier. The low
          # sensor sees the obstacle; this one deletes it. Restricting the
          # height band means it can only clear what it can actually observe.
          min_obstacle_height: 0.85
          marking: true
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
        front_prox:
          topic: /etrike/front_depth/scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 6.0
          raytrace_min_range: 0.0
          obstacle_max_range: 5.5
          obstacle_min_range: 0.0
        left_prox:
          topic: /etrike/left_depth/scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 1.6
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
        right_prox:
          topic: /etrike/right_depth/scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 1.6
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
        rear_prox:
          topic: /etrike/rear_depth/scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 1.6
          raytrace_min_range: 0.0
          obstacle_max_range: 1.5
          obstacle_min_range: 0.0
        terrain_scan:
          topic: /etrike/terrain/scan
          data_type: LaserScan

          # Persistent terrain memory is marking-only here.
          # Ordinary obstacle sources clear first; this
          # terrain observation then re-marks the remembered
          # hazard in the same ObstacleLayer.
          marking: true
          clearing: false
          inf_is_valid: false

          min_obstacle_height: -0.5
          max_obstacle_height: 2.0

          obstacle_min_range: 0.30
          obstacle_max_range: 3.80

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.5
        inflation_radius: 0.60
      always_send_full_costmap: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_footprint
      resolution: 0.1
      track_unknown_space: false
      rolling_window: false
      footprint: '[[-0.30,-0.40],[1.25,-0.40],[1.25,0.40],[-0.30,0.40]]'
      plugins:
      - static_layer
      - obstacle_layer
      - terrain_layer
      - inflation_layer
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan front_scan
        front_scan:
          topic: /etrike/front_scan
          data_type: LaserScan
          clearing: true
          marking: true
          max_obstacle_height: 2.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.5
          obstacle_min_range: 0.0
        scan:
          topic: /etrike/scan
          max_obstacle_height: 2.0
          clearing: true
          # The 0.92m scan plane passes OVER low obstacles - a 0.6m bench,
          # a 0.9m urn - and then raytraces those cells as free, erasing
          # what the 0.30m front_lidar marked a moment earlier. The low
          # sensor sees the obstacle; this one deletes it. Restricting the
          # height band means it can only clear what it can actually observe.
          min_obstacle_height: 0.85
          marking: true
          data_type: LaserScan
          raytrace_max_range: 12.0
          raytrace_min_range: 0.0
          obstacle_max_range: 10.0
          obstacle_min_range: 0.0
      terrain_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        combination_method: 1
        observation_sources: terrain_scan

        terrain_scan:
          topic: /etrike/terrain/scan
          data_type: LaserScan

          marking: true
          clearing: true
          inf_is_valid: true

          min_obstacle_height: -0.5
          max_obstacle_height: 2.0

          obstacle_min_range: 0.30

          # IMPORTANT:
          # Real terrain returns may mark obstacles only inside
          # 3.80 m. Synthetic +inf beams project near range_max
          # (~4.20 m) and are used ONLY for clearing.
          #
          # Keeping a clear separation between obstacle and
          # raytrace range prevents a false circular obstacle
          # from being marked around the robot.
          obstacle_max_range: 3.80

          raytrace_min_range: 0.0
          raytrace_max_range: 4.20

      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 1.0
        inflation_radius: 0.60
      always_send_full_costmap: false
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 20.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: nav2_smac_planner/SmacPlannerHybrid
      tolerance: 0.5
      downsample_costmap: false
      downsampling_factor: 1
      allow_unknown: true
      max_iterations: 200000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      motion_model_for_search: "DUBIN"
      angle_quantization_bins: 72
      analytic_expansion_ratio: 3.5
      analytic_expansion_max_length: 5.0
      minimum_turning_radius: 1.0
      reverse_penalty: 2.0
      change_penalty: 3.0
      non_straight_penalty: 1.2
      cost_penalty: 2.0
      retrospective_penalty: 0.015
      lookup_table_size: 20.0
      cache_obstacle_heuristic: false
      smooth_path: true
      smoother:
        max_iterations: 1000
        w_smooth: 0.3
        w_data: 0.2
        tolerance: 1.0e-10
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_footprint
    transform_tolerance: 1.0
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.4
    rotational_acc_lim: 2.0
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 200
amcl:
  ros__parameters:
    use_sim_time: true
    base_frame_id: base_footprint
    odom_frame_id: odom
    global_frame_id: map
    scan_topic: /etrike/scan
    robot_model_type: nav2_amcl::OmniMotionModel
    min_particles: 500
    max_particles: 3000
    update_min_d: 0.2
    update_min_a: 0.15
    resample_interval: 1
    transform_tolerance: 1.0
    alpha1: 0.1
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.1
    alpha5: 0.1
    laser_model_type: likelihood_field
    laser_likelihood_max_dist: 2.0
    laser_max_range: 25.0
    laser_min_range: 0.45
    max_beams: 120
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1
    pf_err: 0.05
    pf_z: 0.99
    do_beamskip: false
    tf_broadcast: true
    save_pose_rate: 0.5
    set_initial_pose: false
