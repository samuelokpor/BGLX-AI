collision_monitor:
  ros__parameters:
    use_sim_time: true

    base_frame_id: "base_link"
    odom_frame_id: "odom"

    # Nav2 / agent commands enter here.
    cmd_vel_in_topic: "/etrike/cmd_vel"

    # Safe command continues to the BGLX final limiter.
    cmd_vel_out_topic: "/etrike/collision_checked_cmd_vel"

    transform_tolerance: 0.5
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 1.0

    # ----------------------------------------------------------
    # HUMBLE DIRECTION-AWARE COLLISION PROTECTION
    # ----------------------------------------------------------
    #
    # Previous configuration used independent FrontStop,
    # RearStop, LeftStop and RightStop polygons.
    #
    # Static STOP polygons trigger regardless of whether the
    # requested velocity is moving toward or away from the
    # obstacle. That can trap an Ackermann/tricycle robot:
    #
    # obstacle ahead -> FrontStop -> reverse also becomes zero.
    #
    # The Approach model instead projects the robot footprint
    # along the requested Twist and limits velocity according
    # to predicted time-to-collision.
    #
    # The final cmd_vel_limiter remains downstream as the
    # independent hard-stop / watchdog layer.
    # ----------------------------------------------------------

    polygons: ["FootprintApproach"]

    FootprintApproach:
      type: "polygon"
      action_type: "approach"

      # Use the same footprint Nav2 is actually planning with.
      footprint_topic: "/local_costmap/published_footprint"

      # Begin progressively restricting a command when the
      # predicted footprint collision is inside this horizon.
      time_before_collision: 1.5

      # Simulation integration step used by Collision Monitor.
      simulation_time_step: 0.05

      # ROS 2 Humble uses max_points rather than the newer
      # min_points parameter.
      max_points: 2

      visualize: true
      polygon_pub_topic: "/etrike/footprint_approach_polygon"

    # ----------------------------------------------------------
    # SENSOR SOURCES
    # ----------------------------------------------------------

    observation_sources:
      - "front_scan"
      - "left_scan"
      - "right_scan"
      - "rear_scan"

    front_scan:
      type: "scan"
      topic: "/etrike/front_scan"

    left_scan:
      type: "scan"
      topic: "/etrike/left_depth/scan"

    right_scan:
      type: "scan"
      topic: "/etrike/right_depth/scan"

    rear_scan:
      type: "scan"
      topic: "/etrike/rear_depth/scan"
